name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod is the single source of truth for the toolchain version. An
      # explicit version here drifts from it silently, and a bare "1.26" is
      # read by setup-go as an exact tag rather than a range.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: make vet

      # Routed through the Makefile so the T0.1 done-when condition -- a fresh
      # clone passing "make test" -- is the thing CI actually verifies, rather
      # than a parallel set of go commands that can drift from it.
      - name: Test with race detector
        run: make race

      # go test runs the seed corpus only; it does not fuzz. Without this step
      # nothing enforces the T1.1 done-when condition of 60s without a panic.
      - name: Fuzz the RESP reader
        run: make fuzz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not "latest": CLAUDE.md requires the linter to be clean with no
      # suppressions, so a new upstream release must not be able to turn CI red
      # on a push that changed nothing. Bump deliberately.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # T2.4's done-when condition: 100 consecutive randomised SIGKILL/restart
      # iterations at sync=always, every acknowledged write present after
      # recovery, running as a CI job rather than only ever by hand.
      - name: Kill/restart durability suite
        run: make crash
